###########################################################  
#							  #
#		  Hyprland config file 	         	  #
#         Mostly taken from the default config		  #
#							  #
###########################################################


monitor = DP-1, 1920x1080@144, 1680x0, 1



#
# Default applications
#
$term = alacritty
$menu = wofi --show drun
$browser = firefox-bin


#
# Autostart
#
env = WALLPAPER, /home/lars/Pictures/Wallpapers/Orange_Forest_Sunset.jpg
exec-once = swaync --style ~/.config/swaync/style.css &
exec-once = waybar &
exec-once = gentoo-pipewire-launcher &
exec-once = kwalletd6 &
exec-once = nextcloud &
exec-once = signal-desktop
exec-once = kdeconnectd &
exec-once = kdeconnect-indicator &
exec-once = hyprpaper &
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /bin/bash -c ~/.config/hypr/xdg-portal-hyprland
exec-once = hyprctl setcursor Nordzy-hyprcursors-lefthand 24


#
# Environment variables
#

env = XCUSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24
env = HYPRCURSOR_THEME, Nordzy-hyprcursors-lefthand
env = XCURSOR_THEME, Nordzy-cursors-lefthand
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
env = QT_QPA_PLATFORM, xcb
env = RANGER_LOAD_DEFAULT_RC, FALSE
env = EDITOR, /bin/nvim




# Enable logs
debug {
	disable_logs = false
}


#
# General looks
#
general {
	gaps_in = 10
	gaps_out = 20

	border_size = 2

	col.active_border = rgba(ce8745ff)
	col.inactive_border = rgba(ce874580)

	resize_on_border = true
	
	allow_tearing = false

	layout = dwindle

}

decoration {

	rounding = 0
	rounding_power = 5

	active_opacity = 1.0
	inactive_opacity = 1.0

	shadow {

		enabled = true
		range = 4
		render_power = 3
		color = rgba(1a1a1aee)
	}

	blur {

		enabled = true
		size = 5
		passes = 1
		vibrancy = 1
	}

}


#
# Animations
#
animations {
	
	enabled = yes

	bezier = easeOutQuint, 0.23, 1, 0.32, 1
	bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
	bezier = linear, 0, 0, 1, 1
	bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
	bezier = quick, 0.15, 0, 0.1, 1

	animation = global, 1, 10, default
	animation = border, 1, 5.39, easeOutQuint
	animation = windows, 1, 4.79, easeOutQuint
	animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
	animation = windowsOut, 1, 1.49, linear, popin 87%
	animation = fadeIn, 1, 1.73, almostLinear
	animation = fadeOut, 1, 1.46, almostLinear
	animation = layers, 1, 3.81, easeOutQuint
	animation = layersIn, 1, 4, easeOutQuint
	animation = layersOut, 1, 1.5, easeOutQuint, fade
	animation = fadeLayersIn, 1, 1.79, almostLinear
	animation = fadeLayersOut, 1, 1.39, almostLinear
	animation = workspaces, 1, 1.94, almostLinear, fade
	animation = workspacesIn, 1, 1.21, almostLinear, fade
	animation = workspacesOut, 1, 1.94, almostLinear, fade

}


#
# Layout options
#
dwindle {

	pseudotile = true
	preserve_split = true
}


#
# Misc
#
misc {
	force_default_wallpaper = 0
	disable_hyprland_logo = true
}


#
# Input
#
input {
	kb_layout = us
	follow_mouse = 1
	# Mouse was too sensitive
	sensitivity = -1
}


#
# Keybindings
# I am using i3/swaywm like keybindings, because I am used to them
#
$mod = ALT

bind = $mod, return, exec, $term
bind = $mod, d, exec, $menu
bind = $mod, b, exec, $browser
bind = $mod SHIFT, q, killactive,
bind = $mod SHIFT, e, exit,
bind = $mod, space, togglefloating,
bind = $mod, P, pseudo,
bind = $mod, t, togglesplit,
bind = $mod SHIFT, n, exec, swaync-client -t
bind = $mod, s, exec, hyprshot -m region -o /home/lars/Nextcloud/Pictures/Screenshots/
# Yes, this is a windows binding, but I am really used to this
bind = WIN, l, exec, hyprlock
bind = $mod, f, fullscreen

# Moving the focus (vim like)
bind = $mod, h, movefocus, l
bind = $mod, j, movefocus, d
bind = $mod, k, movefocus, u
bind = $mod, l, movefocus, r

# Moving windows around
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, j, movewindow, d
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, l, movewindow, r

bind = $mod CTRL, h, workspace, -1
bind = $mod CTRL, l, workspace, +1

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Scratchpad
bind = $mod, minus, togglespecialworkspace, magic
bind = $mod SHIFT, minus, movetoworkspace, special:magic

# Scrolling through workspaces
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# movin and resizing windows using the mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow


# Audio keys
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioStop, exec, playerctl stop

# Some default window rules
windowrule = suppressevent maximize, class:.*


#
# Moving windows around for my default setup
#

windowrule = monitor DP-1, class:firefox, title:.*Spotify.*
windowrule = workspace 4, class:firefox, title:.*Spotify.*

windowrule = monitor DP-1, class:Alacritty, title:cava
windowrule = workspace 2, class:Alacritty, title:cava

windowrule = monitor DP-1, class:Alacritty, title:cbonsai.*
windowrule = workspace 2, class:Alacritty, title:cbonsai.*

windowrule = monitor DP-1, class:signal
windowrule = workspace 3, class:signal

windowrule = float, title:(Eclipse)
windowrule = float, title:(.*Eclipse IDE Launcher .*)
windowrule = float, class:Eclipse, title:(Eclipse IDE.*)
